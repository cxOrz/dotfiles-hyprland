[device]
# Use iwd instead of wpa_supplicant as the Wi-Fi backend.
wifi.backend=iwd

# Let NetworkManager drive auto-connect instead of iwd.
#
# With iwd driving auto-connect, iwd picks a network on its own and silently
# gives up after a single failed attempt — nothing ever reconnects afterwards.
# See https://bugzilla.redhat.com/show_bug.cgi?id=1861919 and the workaround in
# the ArchWiki "Using iwd as the Wi-Fi backend" section.
wifi.iwd.autoconnect=false
